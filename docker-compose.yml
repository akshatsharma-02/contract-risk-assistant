services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: clause-detector-api
    expose:
      - "8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - clause-detector-network
    restart: unless-stopped

  streamlit:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: clause-detector-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    networks:
      - clause-detector-network
    depends_on:
      - api
    restart: unless-stopped

networks:
  clause-detector-network:
    driver: bridge